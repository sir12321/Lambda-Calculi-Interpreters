name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCaml
        run: sudo apt-get update && sudo apt-get install -y ocaml-nox
      - name: Build
        run: make
      - name: Test
        run: make test
